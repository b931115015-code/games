<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#7b9ee8">
<title>星萌探險隊｜第二版</title>
<style>
:root{
  --ink:#34415e;--muted:#71809d;--paper:#fffdf7;--blue:#7b9ee8;
  --pink:#ff9db5;--mint:#8bd9c1;--yellow:#ffd66e;--lav:#b9a7f5;
  --shadow:0 12px 30px rgba(66,84,130,.13);--line:#e8ecf6;
}
*{box-sizing:border-box}
body{
  margin:0;color:var(--ink);font-family:"Trebuchet MS","Noto Sans TC","Microsoft JhengHei",sans-serif;
  background:radial-gradient(circle at 10% 5%,#fff5cf 0,transparent 26%),
             radial-gradient(circle at 90% 10%,#e6f5ff 0,transparent 28%),
             linear-gradient(145deg,#f5f8ff,#fff8f1 55%,#f2fff8);
  min-height:100vh;
}
button{font:inherit;cursor:pointer;border:0}
button:disabled{opacity:.42;cursor:not-allowed;filter:grayscale(.2)}
.app{max-width:1180px;margin:0 auto;padding:20px 18px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:13px}
.logo{width:58px;height:58px;border-radius:20px;background:linear-gradient(145deg,#ffdc7d,#ff9db5);display:grid;place-items:center;font-size:32px;box-shadow:0 8px 18px #edb4a65c;border:3px solid #fff}
h1{font-size:clamp(22px,4vw,34px);margin:0;letter-spacing:1px}
.subtitle{color:var(--muted);font-size:13px;margin-top:3px}
.header-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pill{background:#fff;border:1px solid var(--line);border-radius:99px;padding:8px 12px;font-size:13px;box-shadow:0 4px 12px #6c83b20b}
.pill strong{color:#526fae}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px;align-items:start}
.sidebar,.panel{background:rgba(255,255,255,.88);border:1px solid #fff;border-radius:24px;box-shadow:var(--shadow)}
.sidebar{padding:14px;position:sticky;top:14px}
.trainer{background:linear-gradient(140deg,#e8f3ff,#fff0f4);border-radius:18px;padding:15px;text-align:center;margin-bottom:13px}
.trainer-avatar{font-size:42px}
.trainer-name{font-weight:800;margin-top:3px}
.trainer-small{font-size:12px;color:var(--muted);margin-top:3px}
.nav{display:grid;gap:7px}
.nav button{padding:12px 13px;border-radius:14px;text-align:left;background:transparent;color:#61708e;font-weight:700;transition:.18s}
.nav button:hover{background:#f4f6ff}
.nav button.active{background:linear-gradient(100deg,#e7efff,#f3edff);color:#4c66a5;box-shadow:inset 3px 0 #7b9ee8}
.sidebar-note{margin-top:14px;padding:12px;border-radius:15px;background:#fff9e9;color:#8b7544;font-size:12px;line-height:1.6}
main{min-width:0}
.panel{padding:20px;min-height:590px}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.panel-head h2{margin:0;font-size:23px}
.panel-head p{margin:5px 0 0;color:var(--muted);font-size:13px}
.tag{font-size:11px;font-weight:800;padding:6px 10px;border-radius:99px;background:#eef4ff;color:#6681c0;white-space:nowrap}
.hero{
  border-radius:22px;padding:22px;min-height:170px;position:relative;overflow:hidden;
  background:linear-gradient(110deg,#c7eddb,#dff4ff 55%,#f8e8ff);
  display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:16px;
}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:#ffffff55}
.hero:before{width:180px;height:180px;right:100px;top:-100px}
.hero:after{width:130px;height:130px;right:-20px;bottom:-75px}
.hero-copy{position:relative;z-index:1;max-width:470px}
.hero h3{font-size:25px;margin:0 0 8px}
.hero p{margin:0;color:#61768b;line-height:1.7;font-size:14px}
.hero-art{font-size:clamp(60px,9vw,100px);filter:drop-shadow(0 9px 4px #7895a433);position:relative;z-index:1;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{padding:12px;border-radius:16px;background:#f8faff;border:1px solid #edf0f8}
.stat .k{font-size:11px;color:var(--muted)}
.stat .v{font-size:21px;font-weight:900;margin-top:3px}
.stat .ico{float:right;font-size:19px}
.section-title{font-size:15px;font-weight:900;margin:18px 0 10px}
.region-card{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px;border:1px solid #e7ecf7;border-radius:18px;background:linear-gradient(110deg,#f5fff8,#f5f8ff)}
.region-left{display:flex;align-items:center;gap:12px}
.region-icon{width:58px;height:58px;border-radius:17px;background:#dff5e8;display:grid;place-items:center;font-size:31px}
.region-name{font-weight:900}
.region-desc{font-size:12px;color:var(--muted);margin-top:4px}
.primary,.secondary,.soft,.danger{
  padding:11px 16px;border-radius:13px;font-weight:900;transition:.18s;
}
.primary{background:linear-gradient(120deg,#7e9fea,#a78be8);color:white;box-shadow:0 6px 14px #819ce84a}
.primary:hover{transform:translateY(-2px);box-shadow:0 9px 17px #819ce85c}
.secondary{background:#fff0f4;color:#bd6681;border:1px solid #ffe0e9}
.soft{background:#eff4ff;color:#5f79b5;border:1px solid #e1e9ff}
.danger{background:#fff0ed;color:#c66b5e}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.tip{font-size:12px;color:var(--muted);line-height:1.65;margin-top:12px}
.battle-scene{
  min-height:280px;border-radius:22px;padding:18px;position:relative;overflow:hidden;
  background:linear-gradient(#dff4ff 0%,#e9f8ff 56%,#c9edcf 56%,#b5e4b9 100%);
  border:1px solid #d8eaf0;margin-bottom:14px;
}
.battle-scene:before{content:"";position:absolute;width:220px;height:70px;border-radius:50%;background:#fff9;top:24px;left:9%;filter:blur(1px)}
.battle-scene:after{content:"";position:absolute;width:270px;height:90px;border-radius:50%;background:#fff8;top:58px;right:-4%;filter:blur(1px)}
.battle-ground{position:absolute;bottom:22px;left:7%;right:7%;height:85px;border-radius:50%;background:#8bcf9b66}
.creature-side{position:absolute;z-index:2;display:flex;flex-direction:column;align-items:center;gap:5px}
.creature-side.wild{right:12%;top:25px}
.creature-side.player{left:12%;bottom:18px}
.creature-sprite{font-size:clamp(54px,8vw,82px);filter:drop-shadow(0 8px 4px #5d7d6b55);animation:bob 2.2s ease-in-out infinite}
.creature-side.player .creature-sprite{animation-delay:.4s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.creature-label{background:#ffffffed;border-radius:99px;padding:5px 10px;font-size:12px;font-weight:900;box-shadow:0 3px 8px #7185a522}
.hpbox{width:145px;background:#ffffffed;border-radius:12px;padding:6px 8px;box-shadow:0 3px 8px #7185a522}
.hp-top{display:flex;justify-content:space-between;font-size:10px;font-weight:800;margin-bottom:4px}
.hpbar{height:7px;border-radius:99px;background:#e9edf4;overflow:hidden}
.hpfill{height:100%;border-radius:99px;background:linear-gradient(90deg,#80d8a4,#44bd85);transition:width .25s}
.hpfill.low{background:linear-gradient(90deg,#ffc56b,#f27d75)}
.battle-log{background:#fff;border:1px solid #edf0f8;border-radius:15px;padding:12px 14px;min-height:54px;font-size:13px;line-height:1.6;margin-bottom:12px}
.battle-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.action-btn{padding:13px 8px;border-radius:14px;font-weight:900;background:#f1f5ff;color:#5c76b1;border:1px solid #e1e9fa}
.action-btn.attack{background:#fff0ed;color:#c66d5d;border-color:#ffe1d9}
.action-btn.skill{background:#f4efff;color:#8b6bc5;border-color:#e9ddff}
.action-btn.catch{background:#fff5db;color:#9a7a2c;border-color:#ffebad}
.action-btn.run{background:#f1f4f7;color:#778398;border-color:#e8edf2}
.empty-state{text-align:center;padding:35px 15px}
.empty-state .big{font-size:70px}
.empty-state h3{margin:10px 0 6px}
.empty-state p{color:var(--muted);font-size:13px;line-height:1.6}
.collection-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}
.pet-card{border:1px solid #e8edf6;border-radius:17px;padding:12px;background:#fff;position:relative;min-width:0}
.pet-card.unknown{background:#f7f8fb;color:#aab2c2}
.pet-card .pet-emoji{font-size:39px;text-align:center;margin:3px 0 7px}
.pet-card .pet-name{font-weight:900;text-align:center;font-size:13px}
.pet-card .pet-meta{text-align:center;color:var(--muted);font-size:11px;margin-top:4px}
.pet-card .pet-level{position:absolute;top:8px;right:8px;font-size:10px;background:#f1f5ff;color:#6780ba;padding:4px 6px;border-radius:99px}
.rarity{display:inline-block;border-radius:99px;padding:3px 7px;font-size:10px;font-weight:900;margin-top:7px}
.r-common{background:#eef2f7;color:#7a8798}.r-uncommon{background:#e5f7ed;color:#4d9b70}.r-rare{background:#e9edff;color:#687bd0}.r-epic{background:#f4e9ff;color:#9967c8}.r-legend{background:#fff0d0;color:#b5862e}
.filter-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px}
.filter-row select,.filter-row input{border:1px solid #e3e9f3;background:#fff;border-radius:11px;padding:9px 11px;color:var(--ink);font:inherit;font-size:12px}
.bag-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.item-card{border:1px solid #e8edf6;border-radius:18px;padding:16px;display:flex;align-items:center;gap:13px;background:#fff}
.item-icon{font-size:35px}
.item-name{font-weight:900}
.item-desc{font-size:11px;color:var(--muted);margin-top:4px}
.item-count{font-weight:900;color:#6e83bc;margin-left:auto}
.team-list{display:grid;gap:9px}
.team-row{display:flex;align-items:center;gap:12px;border:1px solid #e8edf6;border-radius:15px;padding:10px 12px;background:#fff}
.team-row .emoji{font-size:32px}
.team-row .info{flex:1;min-width:0}
.team-row .name{font-weight:900;font-size:13px}
.team-row .sub{font-size:11px;color:var(--muted);margin-top:3px}
.team-row .smallbar{height:6px;background:#edf0f6;border-radius:99px;margin-top:6px;overflow:hidden}
.team-row .smallbar span{display:block;height:100%;background:#83d3a0}
.locked{opacity:.72;background:linear-gradient(110deg,#f6f7fb,#f2f3f8)}
footer{text-align:center;color:#9aa4b6;font-size:11px;margin-top:17px}
.modal-backdrop{position:fixed;inset:0;background:#26324d99;display:grid;place-items:center;padding:18px;z-index:20}
.modal{width:min(560px,100%);background:#fff;border-radius:25px;padding:23px;box-shadow:0 20px 70px #1d2b4c55}
.modal h2{margin:0 0 7px;font-size:23px}
.modal p{color:var(--muted);font-size:13px;line-height:1.6}
.starter-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:17px 0}
.starter{border:2px solid #e8edf6;background:#fff;border-radius:17px;padding:13px 7px;text-align:center}
.starter.selected{border-color:#8ca5eb;background:#f2f5ff}
.starter .s-emoji{font-size:42px}
.starter strong{display:block;font-size:13px;margin:5px 0 3px}
.starter small{font-size:10px;color:var(--muted)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#34415e;color:white;padding:11px 16px;border-radius:99px;font-size:13px;box-shadow:0 8px 25px #1e2d4b44;transition:.25s;z-index:30;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:760px){
 .layout{grid-template-columns:1fr}.sidebar{position:static;padding:10px}
 .trainer{display:none}.nav{grid-template-columns:repeat(4,1fr)}
 .nav button{text-align:center;padding:10px 5px;font-size:12px}
 .sidebar-note{display:none}.panel{padding:15px;min-height:500px}
 .stats{grid-template-columns:repeat(2,1fr)}.hero{padding:17px;min-height:150px}
 .battle-actions{grid-template-columns:repeat(2,1fr)}.hpbox{width:125px}
}
@media(max-width:420px){
 .app{padding:12px 10px 28px}.header-right .pill:nth-child(2){display:none}
 .starter-grid{gap:5px}.starter{padding:10px 4px}
 .bag-grid{grid-template-columns:1fr}.collection-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .hero-art{font-size:58px}
}

/* 第二版：自由移動地圖與原創 SVG 寵物造型 */
.map-card{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:12px;padding:12px;border:1px solid #e3ebdc;border-radius:20px;background:linear-gradient(135deg,#f2fff0,#f3f8ff);}
.map-frame{min-width:0;overflow:hidden;border-radius:15px;border:3px solid #fff;box-shadow:0 5px 15px #496d4a20;background:#a8d993;}
#worldMap{display:block;width:100%;height:auto;aspect-ratio:25/14;image-rendering:pixelated;outline:none;touch-action:manipulation;}
#worldMap:focus{box-shadow:inset 0 0 0 3px #7b9ee8;}
.map-side{display:flex;flex-direction:column;gap:9px;min-width:0;}
.map-location{padding:10px 11px;border-radius:13px;background:#fff;font-size:12px;line-height:1.6;border:1px solid #edf1e8;}
.map-location strong{display:block;color:#567d55;font-size:14px;margin-bottom:2px;}
.map-legend{font-size:11px;color:#71809d;line-height:1.7;padding:0 3px;}
.map-legend span{white-space:nowrap;margin-right:5px;}
.dpad{display:grid;grid-template-columns:repeat(3,38px);grid-template-rows:repeat(2,38px);gap:5px;justify-content:center;align-content:center;padding:7px;border-radius:14px;background:#ffffffb8;}
.dpad button{border:1px solid #dfe8f4;border-radius:10px;background:#fff;color:#5d76b3;font-size:18px;font-weight:900;box-shadow:0 2px 5px #6b83aa16;}
.dpad button:active{transform:translateY(1px);background:#eaf0ff;}
.dpad [data-move="0,-1"]{grid-column:2;grid-row:1;}
.dpad [data-move="-1,0"]{grid-column:1;grid-row:2;}
.dpad [data-move="0,1"]{grid-column:2;grid-row:2;}
.dpad [data-move="1,0"]{grid-column:3;grid-row:2;}
.map-help{font-size:11px;color:#74809a;line-height:1.55;text-align:center;}
.map-search{width:100%;padding:10px 8px;font-size:12px;}
.creature-art{display:inline-flex;align-items:center;justify-content:center;width:92px;height:84px;vertical-align:middle;}
.creature-art svg{display:block;width:100%;height:100%;overflow:visible;}
.creature-sprite{width:112px;height:100px;display:grid;place-items:center;filter:drop-shadow(0 8px 4px #5d7d6b55);animation:bob 2.2s ease-in-out infinite;}
.creature-side.player .creature-sprite{animation-delay:.4s;}
.pet-visual{display:flex;justify-content:center;align-items:center;height:78px;margin:0 0 5px;}
.pet-visual .creature-art{width:84px;height:76px;}
.starter .s-art{height:76px;display:grid;place-items:center;}
.starter .s-art .creature-art{width:80px;height:72px;}
.team-row .team-art{width:66px;height:62px;display:grid;place-items:center;flex:none;}
.team-row .team-art .creature-art{width:66px;height:60px;}
@media(max-width:760px){.map-card{grid-template-columns:1fr}.map-side{display:grid;grid-template-columns:1fr 1fr;align-items:center}.map-location{grid-column:1/-1}.map-legend{grid-column:1/-1}.map-search{grid-column:1/-1}.map-help{grid-column:1/-1}.dpad{grid-column:1/-1;grid-row:2;}}
@media(max-width:420px){.map-card{padding:8px}.map-side{grid-template-columns:1fr}.dpad{grid-column:auto;grid-row:auto}.map-legend,.map-help,.map-search{grid-column:auto}}

</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo">🌟</div>
      <div><h1>星萌探險隊</h1><div class="subtitle">STAR BUDDY QUEST · 第二版</div></div>
    </div>
    <div class="header-right">
      <div class="pill">🪙 金幣 <strong id="coinTop">100</strong></div>
      <div class="pill">🔴 捕捉球 <strong id="ballTop">10</strong></div>
      <div class="pill">📚 圖鑑 <strong id="dexTop">0 / 150</strong></div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="trainer">
        <div class="trainer-avatar">🧢</div>
        <div class="trainer-name">星萌訓練家</div>
        <div class="trainer-small">踏上尋找星之寵物的旅程！</div>
      </div>
      <nav class="nav">
        <button class="active" data-tab="adventure">🗺️ 冒險</button>
        <button data-tab="team">🐾 隊伍</button>
        <button data-tab="dex">📖 寵物圖鑑</button>
        <button data-tab="bag">🎒 背包</button>
      </nav>
      <div class="sidebar-note">✨ 小提醒：野生寵物的生命值越低，捕捉成功率通常越高！記得先戰鬥，再找機會收服牠。</div>
    </aside>

    <main>
      <section class="panel" id="mainPanel"></section>
    </main>
  </div>
  <footer>星萌探險隊第二版 · 自由移動 2D 地圖與 150 種原創 SVG 寵物 · 進度自動儲存</footer>
</div>
<div class="toast" id="toast"></div>
<div id="modalRoot"></div>

<script>
"use strict";

/* ==========================================================
   星萌探險隊：內容擴充區
   新增寵物：在 SPECIES_SEEDS 的對應屬性中加入名字即可。
   新增地區/階段：在 PHASES 陣列新增設定，並設定 encounterElements。
   核心戰鬥、捕捉、圖鑑及存檔系統會自動讀取資料。
   ========================================================== */

const ELEMENTS = {
  fire:{name:"火",color:"#ff9c82",icon:"🔥",names:["焰豆狐","炎絨團","焦糖蜥","火花栗","熔岩咚","赤尾雀","炙炙羊","燈芯熊","燒雲貓","焰角鹿","暖爐龜","紅焰蛙","爆米龍","熾羽鴞","火山糰"],emojis:["🦊","🐥","🦎","🐿️","🐲","🐦","🐑","🐻","🐱","🦌","🐢","🐸","🐉","🦉","🐾"]},
  water:{name:"水",color:"#75bce9",icon:"💧",names:["泡泡鯨","水滴兔","藍潮貂","泉泉蛙","海鹽貓","漩渦鰻","冰河獺","珊瑚鹿","雨傘魚","水母燈","溪谷熊","泡沫鴨","深海團","露珠狐","潮汐龍"],emojis:["🐳","🐰","🦦","🐸","🐱","🐟","🦭","🦌","🐠","🪼","🐻","🦆","🐙","🦊","🐉"]},
  grass:{name:"草",color:"#83c995",icon:"🍃",names:["葉芽兔","森森鹿","藤蔓貓","苔球龜","花冠狐","豆苗鼠","蘑菇熊","竹葉熊","花瓣羊","種子鴞","森林團","薄荷蛇","果實龍","蔓蔓蛙","樹芽鹿"],emojis:["🐰","🦌","🐱","🐢","🦊","🐭","🐻","🐼","🐑","🦉","🐾","🐍","🐲","🐸","🦌"]},

function createMeadowLayout(){
  const w=25,h=14,g=Array.from({length:h},()=>Array(w).fill("g"));
  for(let x=0;x<w;x++){g[0][x]="t";g[h-1][x]="t";}
  for(let y=0;y<h;y++){g[y][0]="t";g[y][w-1]="t";}
  // 石磚小徑：中央交會，能通往各片草叢。
  for(let x=1;x<w-1;x++)g[10][x]="p";
  for(let y=2;y<=10;y++)g[y][5]="p";
  for(let x=5;x<=22;x++)g[6][x]="p";
  // 池塘與樹叢作為不可穿越的地形。
  for(let y=2;y<=4;y++)for(let x=17;x<=21;x++)g[y][x]="w";
  for(let y=2;y<=3;y++)for(let x=9;x<=12;x++)g[y][x]="t";
  [[14,3],[15,3],[2,8],[11,8],[22,7],[8,12],[18,12]].forEach(([x,y])=>g[y][x]="t");
  [[19,8],[20,8],[20,9],[21,9],[2,4],[3,4],[4,4],[2,5],[3,5],[4,5],
   [8,7],[9,7],[10,7],[8,8],[9,8],[10,8],[14,8],[15,8],[16,8],[14,9],[15,9],
   [20,11],[21,11],[22,11]].forEach(([x,y])=>g[y][x]="h");
  [[7,3],[7,4],[13,5],[16,11],[6,12],[22,5]].forEach(([x,y])=>g[y][x]="f");
  [[7,9],[12,11],[22,9],[3,7]].forEach(([x,y])=>g[y][x]="r");
  return g.map(row=>row.join(""));
}

function battleHTML(pet,wild){
  const me=pet?getSpecies(pet.id):null;

    </div>
    <div class="creature-side player">
      <div class="hpbox"><div class="hp-top"><span>${me.name} · Lv.${pet.level}</span><span>${myHp}/${stats.hp}</span></div><div class="hpbar"><div class="hpfill ${myPct<30?"low":""}" style="width:${myPct}%"></div></div></div>
      <div class="creature-sprite">${creatureSVG(me)}</div>

  <div class="battle-actions">

    <button class="action-btn skill" id="skillBtn">✨ 屬性技能</button>
    <button class="action-btn catch" id="catchBtn" ${state.balls<=0?"disabled":""}>🔴 捕捉寵物（${state.balls}）</button>
    <button class="action-btn run" id="runBtn">💨 暫時離開</button>

}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

function activeMap(){return MAPS[state.mapId]||MAPS.meadow;}
function mapTile(x,y){const m=activeMap();if(x<0||y<0||x>=m.width||y>=m.height)return "t";return m.layout[y][x];}
function updateMapStatus(){
  const el=document.getElementById("mapStatus");if(!el)return;
  const tile=mapTile(state.mapX,state.mapY),label=tile==="h"?"站在草叢旁，準備遇見新夥伴！":tile==="p"?"沿著小徑前進，探索草原各處。":"正在探索草原地形。";
  el.innerHTML=`<strong>🌿 ${activeMap().name}</strong>位置：${state.mapX+1}, ${state.mapY+1}<br>已走 ${state.steps||0} 步<br>${label}`;
}
function drawTile(ctx,tile,x,y,size){
  const px=x*size,py=y*size;
  ctx.fillStyle=(x+y)%2?"#a6dc91":"#9ed68b";ctx.fillRect(px,py,size,size);
  // 草地細節
  ctx.strokeStyle="#80c77d";ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(px+5,py+24);ctx.lineTo(px+8,py+19);ctx.moveTo(px+23,py+12);ctx.lineTo(px+25,py+8);ctx.stroke();
  if(tile==="p"){
    ctx.fillStyle="#d9bd8d";ctx.fillRect(px,py,size,size);ctx.fillStyle="#caa978";ctx.fillRect(px+3,py+5,4,3);ctx.fillRect(px+19,py+22,5,3);ctx.fillStyle="#ead3a6";ctx.fillRect(px+10,py+12,8,2);
  }else if(tile==="h"){
    ctx.fillStyle="#85c879";ctx.fillRect(px,py,size,size);
    for(let i=0;i<5;i++){const xx=px+5+i*5;ctx.strokeStyle=i%2?"#3d995b":"#58ad62";ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(xx,py+29);ctx.quadraticCurveTo(xx-3,py+16,xx+1,py+6+(i%3)*3);ctx.stroke();}
    ctx.fillStyle="#b5e77e";ctx.fillRect(px+12,py+18,3,3);ctx.fillRect(px+23,py+12,3,3);
  }else if(tile==="w"){
    ctx.fillStyle="#75c5e8";ctx.fillRect(px,py,size,size);ctx.strokeStyle="#c5f2ff";ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(px+4,py+10);ctx.quadraticCurveTo(px+10,py+5,px+16,py+10);ctx.moveTo(px+16,py+24);ctx.quadraticCurveTo(px+22,py+19,px+28,py+24);ctx.stroke();
  }else if(tile==="t"){
    ctx.fillStyle="#8dcf82";ctx.fillRect(px,py,size,size);ctx.fillStyle="#946c4c";ctx.fillRect(px+13,py+18,7,13);
    ctx.fillStyle="#39865a";ctx.beginPath();ctx.arc(px+16,py+13,13,0,Math.PI*2);ctx.fill();ctx.fillStyle="#55a86b";ctx.beginPath();ctx.arc(px+10,py+12,8,0,Math.PI*2);ctx.arc(px+22,py+11,8,0,Math.PI*2);ctx.fill();ctx.fillStyle="#8bd18b";ctx.beginPath();ctx.arc(px+12,py+7,3,0,Math.PI*2);ctx.fill();
  }else if(tile==="r"){
    ctx.fillStyle="#9ed68b";ctx.fillRect(px,py,size,size);ctx.fillStyle="#8f9c9c";ctx.strokeStyle="#697d80";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(px+5,py+26);ctx.lineTo(px+9,py+12);ctx.lineTo(px+19,py+7);ctx.lineTo(px+28,py+17);ctx.lineTo(px+25,py+28);ctx.closePath();ctx.fill();ctx.stroke();ctx.strokeStyle="#c4d0ca";ctx.beginPath();ctx.moveTo(px+11,py+14);ctx.lineTo(px+18,py+10);ctx.stroke();
  }else if(tile==="f"){
    ctx.strokeStyle="#4e9c5b";ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(px+16,py+28);ctx.lineTo(px+16,py+14);ctx.stroke();ctx.fillStyle="#ff9db5";ctx.beginPath();ctx.arc(px+12,py+12,4,0,Math.PI*2);ctx.arc(px+20,py+12,4,0,Math.PI*2);ctx.arc(px+16,py+8,4,0,Math.PI*2);ctx.fill();ctx.fillStyle="#ffd66e";ctx.beginPath();ctx.arc(px+16,py+12,3,0,Math.PI*2);ctx.fill();
  }
  ctx.strokeStyle="#ffffff20";ctx.lineWidth=1;ctx.strokeRect(px+.5,py+.5,size-1,size-1);
}
function drawPlayer(ctx,cx,cy){
  ctx.fillStyle="#476c5a35";ctx.beginPath();ctx.ellipse(cx,cy+12,12,5,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#42506a";ctx.fillRect(cx-7,cy+4,5,10);ctx.fillRect(cx+2,cy+4,5,10);
  ctx.fillStyle="#7b9ee8";ctx.beginPath();ctx.roundRect(cx-11,cy-4,22,16,6);ctx.fill();
  ctx.fillStyle="#ffd5b5";ctx.beginPath();ctx.arc(cx,cy-12,9,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#5b4a47";ctx.beginPath();ctx.arc(cx,cy-16,9,Math.PI,Math.PI*2);ctx.fill();
  ctx.fillStyle="#ff9db5";ctx.beginPath();ctx.roundRect(cx-10,cy-22,20,6,3);ctx.fill();ctx.fillRect(cx-3,cy-26,9,5);
  ctx.fillStyle="#34415e";ctx.beginPath();ctx.arc(cx-3,cy-12,1.2,0,Math.PI*2);ctx.arc(cx+3,cy-12,1.2,0,Math.PI*2);ctx.fill();
}
function drawMap(){
  const canvas=document.getElementById("worldMap");if(!canvas)return;
  const ctx=canvas.getContext("2d"),m=activeMap(),size=m.tileSize;
  ctx.clearRect(0,0,canvas.width,canvas.height);
  for(let y=0;y<m.height;y++)for(let x=0;x<m.width;x++)drawTile(ctx,m.layout[y][x],x,y,size);
  const px=state.mapX*size+size/2,py=state.mapY*size+size/2;
  drawPlayer(ctx,px,py);
  if(state.wild){ctx.fillStyle="#fff";ctx.globalAlpha=.9;ctx.beginPath();ctx.roundRect(12,12,210,34,10);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle="#52658b";ctx.font="bold 14px sans-serif";ctx.fillText("⚔ 野生寵物正在等待挑戰！",22,34);}
}
function movePlayer(dx,dy){
  if(!state.started||state.tab!=="adventure"||state.wild)return;
  const nx=state.mapX+dx,ny=state.mapY+dy,tile=mapTile(nx,ny);
  if(["t","w","r"].includes(tile)){toast("前方是障礙物，換個方向走走吧！");return;}
  state.mapX=nx;state.mapY=ny;state.steps=(state.steps||0)+1;
  drawMap();updateMapStatus();saveGame();
  const m=activeMap();
  if(tile==="h"&&Math.random()<m.encounterRate)spawnEncounter("你走進草叢，草葉間突然閃過一道光！");
}
function handleMapKey(e){
  if(!state.started||state.tab!=="adventure"||state.wild)return;
  if(e.target&&["INPUT","TEXTAREA","SELECT"].includes(e.target.tagName))return;
  const keys={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],W:[0,-1],s:[0,1],S:[0,1],a:[-1,0],A:[-1,0],d:[1,0],D:[1,0]};
  const move=keys[e.key];if(!move)return;e.preventDefault();movePlayer(move[0],move[1]);
}
document.addEventListener("keydown",handleMapKey);

function explore(){if(state.wild)return;spawnEncounter("你在附近的草叢仔細搜尋，發現了新的夥伴！");}
function spawnEncounter(prefix="草叢晃動！"){
  if(state.wild)return;
  const map=activeMap(),phase=PHASES.find(p=>p.mapId===state.mapId)||PHASES[0];
  const elements=map.encounterElements||phase.encounterElements;
  const candidates=SPECIES.filter(s=>elements.includes(s.element));
  const s=weightedSpecies(candidates);
  const level=1+Math.floor(Math.random()*5);
  const maxHp=Math.round((s.baseHp*s.mult+level*5)*0.85);
  state.wild={id:s.id,level,hp:maxHp,maxHp};
  state.log=`${prefix} 野生的 ${s.name} 出現了！`;
  saveGame();render();
}
function weightedSpecies(list){
  // 先抽稀有度，再從該稀有度中抽選，確保傳說寵物較少出現。
  const roll=Math.random()*100;let acc=0,rarity="common";
  for(const r of RARITIES){acc+=r.weight;if(roll<acc){rarity=r.key;break;}}
  const pool=list.filter(s=>s.rarity===rarity);
  const chosenPool=pool.length?pool:list;
  return chosenPool[Math.floor(Math.random()*chosenPool.length)];
}
function typeMultiplier(attackElement,defendElement){
  const strong={fire:"grass",water:"fire",grass:"water",electric:"water",wind:"grass",rock:"electric",ice:"wind",light:"dark",dark:"star",star:"rock"};
  const weak={fire:"water",water:"grass",grass:"fire",electric:"rock",wind:"ice",rock:"water",ice:"fire",light:"star",dark:"light",star:"dark"};
  if(strong[attackElement]===defendElement)return 1.45;
  if(weak[attackElement]===defendElement)return .75;
  return 1;
}
function battleAttack(isSkill){
  if(!state.wild)return;
  const pet=currentPet(),me=getSpecies(pet.id),wild=state.wild,enemy=getSpecies(wild.id);
  const stats=petStats(pet);
  if(pet.hp<=0){state.log=`${me.name} 已經累了！請到隊伍或背包使用藥水恢復。`;saveGame();render();return;}
  let damage=Math.max(3,Math.round(stats.atk*(isSkill?1.65:1)*(typeMultiplier(me.element,enemy.element))*(0.85+Math.random()*.3)));
  wild.hp=Math.max(0,wild.hp-damage);
  let msg=`${me.name}${isSkill?"使出 "+me.elementName+"屬性技能":"發動攻擊"}！造成 ${damage} 點傷害。`;
  if(wild.hp<=0){
    state.wins++;state.coins+=12+wild.level*2;
    gainXp(pet,18+wild.level*4);
    state.log=msg+` ${enemy.name} 被打敗了！獲得金幣與經驗值。`;
    state.wild=null;saveGame();render();return;
  }
  enemyTurn(msg);
}
function enemyTurn(msg){
  const pet=currentPet(),me=getSpecies(pet.id),enemy=getSpecies(state.wild.id),stats=petStats(pet);
  const damage=Math.max(2,Math.round((enemy.baseAtk+state.wild.level*1.3)*typeMultiplier(enemy.element,me.element)*(0.8+Math.random()*.35)));
  pet.hp=Math.max(0,(pet.hp??stats.hp)-damage);
  msg+=` 野生的 ${enemy.name} 反擊，${me.name} 受到 ${damage} 點傷害！`;
  if(pet.hp<=0)msg+=` ${me.name} 暫時失去戰鬥能力，請使用藥水恢復。`;
  state.log=msg;saveGame();render();
}
function gainXp(pet,amount){
  pet.xp=(pet.xp||0)+amount;
  let need=pet.level*25;
  while(pet.xp>=need){
    pet.xp-=need;pet.level++;need=pet.level*25;
    const max=petStats(pet).hp;pet.hp=max;
    state.log+=` ${getSpecies(pet.id).name} 升級到 Lv.${pet.level} 了！`;
  }
}
function tryCatch(){
  if(!state.wild||state.balls<=0)return;
  const wild=state.wild,s=getSpecies(wild.id);
  state.balls--;
  const missing=1-wild.hp/wild.maxHp;
  const rarityPenalty={common:0,uncommon:5,rare:10,epic:16,legend:22}[s.rarity];
  const chance=Math.min(92,Math.max(12,28+missing*62-rarityPenalty));
  if(Math.random()*100<chance){
    if(state.owned[s.id]){
      state.coins+=18;
      state.log=`成功收服 ${s.name}！牠已經在圖鑑裡了，重複相遇轉換成 18 枚金幣。`;
    }else{
      const newPet={id:s.id,level:wild.level,xp:0,hp:petStats({id:s.id,level:wild.level}).hp};
      state.owned[s.id]=newPet;
      if(state.team.length<6)state.team.push(s.id);
      state.catches++;state.coins+=8;
      state.log=`太棒了！${s.name} 加入你的隊伍！${state.team.length>=6?"隊伍已滿，牠先留在寵物收藏中。":""}`;
    }
    state.wild=null;
  }else{
    state.log=`捕捉球晃了幾下……${s.name} 掙脫了！目前捕捉成功率約 ${Math.round(chance)}%。`;
    if(state.wild)enemyTurn(state.log);
  }
  saveGame();render();
}
function runAway(){
  if(!state.wild)return;
  const name=getSpecies(state.wild.id).name;state.wild=null;state.log=`你和夥伴先離開了現場，${name} 留在草原繼續玩耍。`;
  saveGame();render();
}
function bindBattleActions(){
  document.getElementById("attackBtn")?.addEventListener("click",()=>battleAttack(false));
  document.getElementById("skillBtn")?.addEventListener("click",()=>battleAttack(true));
  document.getElementById("catchBtn")?.addEventListener("click",tryCatch);
  document.getElementById("runBtn")?.addEventListener("click",runAway);
}
function renderTeam(panel){
  const pets=state.team.map(id=>state.owned[id]).filter(Boolean);
  panel.innerHTML=`<div class="panel-head"><div><h2>🐾 我的寵物隊伍</h2><p>最多可帶 6 隻寵物一起冒險。點選「設為夥伴」切換出戰寵物。</p></div><span class="tag">${pets.length} / 6 隻</span></div>
    ${pets.length?`<div class="team-list">${pets.map(p=>{

    }).join("")}</div>`:`<div class="empty-state"><div class="big">🐾</div><h3>隊伍還沒有寵物</h3><p>先去冒險收服你的第一位夥伴吧！</p></div>`}
    <div class="section-title">💡 隊伍小知識</div><div class="tip">每隻寵物都有自己的屬性、生命值與攻擊力。戰鬥勝利可獲得經驗值，升級後能力也會提升。未來版本可加入進化與更豐富的技能。</div>`;
  panel.querySelectorAll("[data-active]").forEach(b=>b.addEventListener("click",()=>{

  }));

function renderBag(panel){
  panel.innerHTML=`<div class="panel-head"><div><h2>🎒 冒險背包</h2><p>準備好道具，讓每一次冒險都更順利。</p></div><span class="tag">道具管理</span></div>

      <div class="item-card"><div class="item-icon">🧪</div><div><div class="item-name">活力藥水</div><div class="item-desc">恢復目前夥伴的生命值。</div></div><div class="item-count">× ${state.potions}</div></div>
      <div class="item-card"><div class="item-icon">🪙</div><div><div class="item-name">冒險金幣</div><div class="item-desc">未來可在商店購買各種道具。</div></div><div class="item-count">${state.coins}</div></div>
      <div class="item-card"><div class="item-icon">📚</div><div><div class="item-name">寵物圖鑑</div><div class="item-desc">記錄已發現與收服的寵物。</div></div><div class="item-count">${ownedCount()}/150</div></div>
    </div>
    <div class="section-title">🧪 使用道具</div>
    <div class="region-card"><div class="region-left"><div class="region-icon" style="background:#f0eaff">💗</div><div><div class="region-name">活力藥水</div><div class="region-desc">恢復目前出戰寵物 35 點生命值。</div></div></div><button class="primary" id="potionBtn" ${state.potions<=0||!currentPet()?"disabled":""}>使用藥水</button></div>
    <div class="section-title">🛍️ 冒險補給</div>
    <div class="region-card"><div class="region-left"><div class="region-icon" style="background:#fff0e7">🔴</div><div><div class="region-name">購買 5 顆捕捉球</div><div class="region-desc">花費 30 枚金幣，補充捕捉道具。</div></div></div><button class="soft" id="buyBalls" ${state.coins<30?"disabled":""}>🪙 30 金幣</button></div>
    <div class="region-card" style="margin-top:8px"><div class="region-left"><div class="region-icon" style="background:#eaf8ef">🧪</div><div><div class="region-name">購買 2 瓶活力藥水</div><div class="region-desc">花費 25 枚金幣，恢復寵物體力。</div></div></div><button class="soft" id="buyPotions" ${state.coins<25?"disabled":""}>🪙 25 金幣</button></div>
    <div class="section-title">💾 遊戲資料</div>
    <div class="tip">遊戲會自動儲存在目前瀏覽器。清除瀏覽器資料可能會刪除存檔，建議保留同一台裝置遊玩。</div>
    <div class="btn-row" style="margin-top:10px"><button class="danger" id="resetBtn">重新開始遊戲</button></div>`;
  document.getElementById("potionBtn").addEventListener("click",usePotion);
  document.getElementById("buyBalls").addEventListener("click",()=>buyItem("balls",5,30));
  document.getElementById("buyPotions").addEventListener("click",()=>buyItem("potions",2,25));
  document.getElementById("resetBtn").addEventListener("click",()=>{
    if(confirm("確定要刪除目前進度並重新開始嗎？")){localStorage.removeItem(SAVE_KEY);state=defaultState();render();}
  });
}
function usePotion(){
  const p=currentPet();if(!p||state.potions<=0)return;
  const max=petStats(p).hp;p.hp=Math.min(max,(p.hp??max)+35);state.potions--;
  state.log=`使用活力藥水！${getSpecies(p.id).name} 恢復了生命值。`;
  saveGame();render();toast("使用成功！夥伴恢復活力了 💗");
}
function buyItem(key,amount,cost){
  if(state.coins<cost)return;
  state.coins-=cost;state[key]+=amount;saveGame();render();toast("補給完成！道具已放進背包。");
}

// 若舊存檔中的隊伍寵物缺少生命值欄位，進入遊戲時補齊。
if(state.started){
  for(const id of state.team){
    const p=state.owned[id];
    if(p&&typeof p.hp!=="number")p.hp=petStats(p).hp;
  }
}
render();
</script>
</body>
</html>
